<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfe8ff">
<meta name="description" content="تماس صوتی دو نفره">
<link rel="manifest" href="/manifest.webmanifest">
<title>تماس صوتی</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;min-height:100vh;padding:20px;font-family:Tahoma,Arial,sans-serif;color:#f8fafc;
 display:grid;place-items:center;overflow:hidden;
 background:
 radial-gradient(circle at 15% 8%,rgba(125,211,252,.55),transparent 34%),
 radial-gradient(circle at 90% 85%,rgba(56,189,248,.30),transparent 40%),
 linear-gradient(145deg,#081725,#0b2030 48%,#07131f);
}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.28}
.o1{width:240px;height:240px;background:#635bff;top:-80px;right:-70px}
.o2{width:200px;height:200px;background:#06b6d4;bottom:-70px;left:-60px}
.card{
 position:relative;width:min(94vw,540px);padding:24px;
 border:1px solid #30363d;border-radius:18px;
 background:linear-gradient(145deg,rgba(35,39,47,.96),rgba(25,29,35,.96));
 box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.05);
 backdrop-filter:blur(24px) saturate(125%);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:25px;
 background:#5865f2;box-shadow:0 12px 30px rgba(88,101,242,.28)}
h1{font-size:21px;margin:0 0 4px} .sub{font-size:11px;color:#8994ad}
.pill{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:99px;background:rgba(255,255,255,.06);font-size:11px;color:#aab5ca}
.dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}.online .dot{background:#22c55e;box-shadow:0 0 12px #22c55e}
.hero{text-align:center;padding:7px 0 18px}
 .avatar{width:132px;height:132px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
 background:radial-gradient(circle at 35% 25%,rgba(88,101,242,.34),rgba(255,255,255,.035));
 border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 55px rgba(0,0,0,.3)}
.calling .avatar{animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 0 16px rgba(99,102,241,.04),0 20px 55px rgba(0,0,0,.3)}}
.statusText{font-size:16px;font-weight:bold;margin-bottom:5px}.statusHint{font-size:11px;color:#8994ad;min-height:19px}
.room{margin:14px auto 18px;width:fit-content;max-width:100%;padding:8px 13px;border-radius:12px;background:rgba(255,255,255,.045);color:#94a3b8;font-size:11px;word-break:break-all}
.room b{color:#c4b5fd}
.timer{height:20px;font-variant-numeric:tabular-nums;color:#94a3b8;font-size:12px}
.mainButton{
 width:100%;border:0;border-radius:20px;padding:17px 16px;color:#fff;font:inherit;font-weight:bold;font-size:15px;cursor:pointer;
 background:#5865f2;color:#fff;box-shadow:0 10px 24px rgba(88,101,242,.25);transition:.18s
}
.mainButton:active{transform:scale(.985)}.mainButton.danger{background:#ed4245;color:#fff;box-shadow:0 10px 24px rgba(237,66,69,.22)}
.mainButton:disabled{opacity:.5;cursor:not-allowed}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.infoBox{padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(255,255,255,.035);text-align:center}
.infoBox strong{display:block;font-size:11px;margin-bottom:4px}.infoBox span{font-size:10px;color:#7f8aa2}
.visualizer{display:flex;align-items:center;justify-content:center;gap:5px;height:30px;margin:4px 0 12px;opacity:.25;transition:.25s}
.visualizer i{display:block;width:4px;height:8px;border-radius:9px;background:#5865f2}
.calling .visualizer{opacity:1}
.calling .visualizer i{animation:wave 850ms ease-in-out infinite alternate}
.calling .visualizer i:nth-child(2){animation-delay:-.15s}.calling .visualizer i:nth-child(3){animation-delay:-.3s}.calling .visualizer i:nth-child(4){animation-delay:-.45s}.calling .visualizer i:nth-child(5){animation-delay:-.6s}
@keyframes wave{from{height:6px;transform:scaleY(.7)}to{height:27px;transform:scaleY(1)}}
.connection{display:flex;justify-content:center;gap:8px;margin:10px 0 0}
.badge{font-size:9px;padding:6px 9px;border-radius:99px;background:#202225;border:1px solid #2f3136;color:#9da3ae}
.hint{margin-top:14px;text-align:center;color:#68758e;font-size:10px;line-height:1.8}
audio{display:none}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<main class="card" id="card">
  <div class="top">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><h1>تماس صوتی</h1><div class="sub">تماس خصوصی دو نفره</div></div>
    </div>
    <div id="status" class="pill"><span class="dot"></span><span id="statusText">در حال اتصال...</span></div>
  </div>

  <section class="hero">
    <div class="avatar" id="avatar"></div>
    <div class="statusText" id="heroText">آماده برای تماس</div>
    <div class="statusHint" id="statusHint">با یک لمس میکروفون را فعال کن</div>
    <div class="room">شناسه اتاق: <b id="room"></b></div>
    <div class="visualizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="timer" id="timer"></div>
    <div class="connection"><span class="badge" id="transport">WebRTC • آماده</span><span class="badge" id="micBadge">میکروفون خاموش</span></div>
  </section>

  <button id="start" class="mainButton"><span id="startIcon"></span><span id="startLabel">وصل کردن میکروفون</span></button>
  <button id="muteBtn" class="muteButton" disabled><span id="muteIcon"></span><span id="muteLabel">خاموش کردن میکروفون</span></button>

  <div class="info">
    <div class="infoBox"><strong>خصوصی</strong><span>حداکثر دو نفر</span></div>
    <div class="infoBox"><strong>WebRTC</strong><span>صوت زنده</span></div>
  </div>

  <div class="hint">بعد از شروع تماس، در مرورگرهای پشتیبانی‌شده کنترل‌های تماس می‌توانند در کنترل‌های رسانه‌ای سیستم و اعلان نمایش داده شوند.</div>
  <audio id="remoteAudio" autoplay playsinline></audio>
</main>

<script>
const $=id=>document.getElementById(id);
const status=$("status"),statusText=$("statusText"),heroText=$("heroText"),statusHint=$("statusHint");
const startBtn=$("start"),startIcon=$("startIcon"),startLabel=$("startLabel"),muteBtn=$("muteBtn"),muteIcon=$("muteIcon"),muteLabel=$("muteLabel"),remoteAudio=$("remoteAudio"),roomEl=$("room"),timerEl=$("timer"),avatar=$("avatar"),logo=$("logo"),card=$("card"),transport=$("transport"),micBadge=$("micBadge");

let muted=false,callStartedAt=0,timerHandle=null,started=false,pc=null,localStream=null,role=null;
let pendingIce=[],remoteDescriptionSet=false,restartTimer=null;

const MIC_ON='<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="11" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path><path d="M8 21h8"></path></svg></span>';
const MIC_OFF='<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="11" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path><path d="M8 21h8"></path><path d="M4 4l16 16"></path></svg></span>';
const PHONE='<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.7 2.6a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6.3 6.3l1.3-1.3a2 2 0 0 1 2.1.5c.8.4 1.7.6 2.6.7A2 2 0 0 1 22 16.9z"></path></svg></span>';
function setMicGraphics(){
  startIcon.innerHTML=started?PHONE:MIC_ON;
  startLabel.textContent=started?"قطع کردن تماس":"وصل کردن میکروفون";
  muteIcon.innerHTML=muted?MIC_ON:MIC_OFF;
  muteLabel.textContent=muted?"روشن کردن میکروفون":"خاموش کردن میکروفون";
  muteBtn.classList.toggle("active",muted);
  muteBtn.disabled=!started;
  avatar.innerHTML=muted?MIC_OFF:MIC_ON;
  logo.innerHTML=started?PHONE:MIC_ON;
}
let iceServers=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}];

const parts=location.pathname.split("/").filter(Boolean);
const roomId=parts[0]==="room"&&parts[1]?decodeURIComponent(parts[1]):crypto.randomUUID().slice(0,8);
if(!location.pathname.startsWith("/room/"))history.replaceState({}, "","/room/"+encodeURIComponent(roomId));
roomEl.textContent=roomId;

const wsProtocol=location.protocol==="https:"?"wss:":"ws:";
const ws=new WebSocket(wsProtocol+"//"+location.host+"/ws/"+encodeURIComponent(roomId));

function setStatus(text,online=false){
 statusText.textContent=text;
 status.classList.toggle("online",online);
 setMicGraphics();
}
function setHero(title,hint){
 heroText.textContent=title;
 statusHint.textContent=hint;
}
function startTimer(){
 if(timerHandle)return;
 callStartedAt=Date.now();
 timerHandle=setInterval(()=>{
   const s=Math.floor((Date.now()-callStartedAt)/1000);
   timerEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
 },1000);
}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;timerEl.textContent=""}

let audioCtx=null;
function ensureAudio(){
 try{
   audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
   if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
 }catch{}
}
function ding(){
 try{
   ensureAudio(); if(!audioCtx)return;
   const now=audioCtx.currentTime;
   [0,1].forEach((n)=>{
     const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
     osc.type="sine"; osc.frequency.value=n?880:660;
     gain.gain.setValueAtTime(.0001,now+n*.13);
     gain.gain.exponentialRampToValueAtTime(.16,now+n*.13+.025);
     gain.gain.exponentialRampToValueAtTime(.0001,now+n*.13+.18);
     osc.connect(gain).connect(audioCtx.destination);
     osc.start(now+n*.13); osc.stop(now+n*.13+.2);
   });
 }catch{}
}
function updateBadges(){
 micBadge.textContent=muted?"میکروفون خاموش":"میکروفون روشن";
 setMicGraphics();
 transport.textContent=pc&&pc.connectionState==="connected"?"⚡ WebRTC • متصل":"📡 WebRTC • در حال اتصال";
}
async function requestNotifications(){
 if(!("Notification" in window))return;
 try{
   if(Notification.permission==="default")await Notification.requestPermission();
 }catch{}
}

async function registerSW(){
 if(!("serviceWorker" in navigator))return;
 try{
   const reg=await navigator.serviceWorker.register("/sw.js?v=6",{scope:"/",updateViaCache:"none"});
   await reg.update();
   await navigator.serviceWorker.ready;
 }catch{}
}
registerSW();

function handleNotificationAction(action){
 if(action==="toggle-microphone")toggleMute();
}
navigator.serviceWorker?.addEventListener("message",e=>{
 if(e.data?.type==="notification-action")handleNotificationAction(e.data.action);
});

async function showCallNotification(){
 if(!("Notification" in window)||Notification.permission!=="granted")return;
 if(!("serviceWorker" in navigator))return;
 try{
   const reg=await navigator.serviceWorker.ready;
   const existing=await reg.getNotifications({tag:"voice-chat-call"});
   if(existing.length)return;
   await reg.showNotification("تماس صوتی",{
     body:"کنترل میکروفون",
     tag:"voice-chat-call",
     renotify:false,
     silent:true,
     requireInteraction:true,
     data:{roomId},
     actions:[{action:"toggle-microphone",title:"قطع و وصل"}]
   });
 }catch(e){console.warn("notification failed",e)}
}

function updateMicState(){
 const active=!!localStream&&!muted;
 if("mediaSession" in navigator){
   try{navigator.mediaSession.setMicrophoneActive?.(active)}catch{}
 }
}

async function setupMediaSession(){
 if(!("mediaSession" in navigator))return;
 try{
   navigator.mediaSession.metadata=new MediaMetadata({title:"تماس صوتی",artist:"Voice Chat",album:"تماس خصوصی"});
   navigator.mediaSession.setActionHandler("togglemicrophone",()=>toggleMute());
   navigator.mediaSession.setActionHandler("hangup",()=>hangup());
   updateMicState();
 }catch{}
}

async function loadTURN(){
 try{
   const r=await fetch("/turn-credentials",{cache:"no-store"});
   if(!r.ok)return;
   const data=await r.json();
   if(data.enabled&&Array.isArray(data.iceServers)&&data.iceServers.length){
     iceServers=[...iceServers,...data.iceServers];
   }
 }catch{}
}

function send(x){if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(x))}

async function preparePeer(){
 if(pc)return;
 pc=new RTCPeerConnection({iceServers,bundlePolicy:"max-bundle",iceCandidatePoolSize:8,iceTransportPolicy:"all"});
 remoteDescriptionSet=false;
 pendingIce=[];
 if(localStream)for(const track of localStream.getTracks())pc.addTrack(track,localStream);

 pc.onicecandidate=e=>{if(e.candidate)send({type:"ice",candidate:e.candidate})};
 pc.onicecandidateerror=e=>console.warn("ICE candidate error",e);
 pc.onnegotiationneeded=()=>{};

 pc.ontrack=async e=>{
   // Keep the incoming audio on its own playback element.
   // Local microphone mute must never modify this stream.
   const remoteTracks=pc.getReceivers().map(r=>r.track).filter(t=>t && t.kind==="audio");
   const stream=remoteTracks.length?new MediaStream(remoteTracks):(e.streams[0]||new MediaStream([e.track]));
   if(remoteAudio.srcObject!==stream)remoteAudio.srcObject=stream;
   remoteAudio.setAttribute("autoplay","");
   remoteAudio.setAttribute("playsinline","");

   remoteAudio.muted=false;
   remoteAudio.volume=1;
   
   await remoteAudio.play().catch(()=>{});
   ensureAudio();
   if("mediaSession" in navigator)navigator.mediaSession.playbackState="playing";
   setStatus("تماس برقرار است",true);
   setHero("متصل شدید","صدای طرف مقابل فعال است");
   ding();
   updateBadges();
   card.classList.add("calling");
   startTimer();
   updateBadges();
   await showCallNotification();
 };

 pc.onconnectionstatechange=()=>{
   if(pc.connectionState==="connected"){
     setStatus("تماس برقرار است",true);
     setHero("متصل شدید","تماس صوتی فعال است");
     ding();
     updateBadges();
     card.classList.add("calling");
     startTimer();
     showCallNotification();
   }
   if(pc.connectionState==="disconnected"){
     clearTimeout(restartTimer);
     restartTimer=setTimeout(()=>restartIce(),1200);
   }
   if(pc.connectionState==="failed"){
     setStatus("اتصال ناپایدار است");
     setHero("اتصال ناپایدار","در حال تلاش برای حفظ تماس");
   }
 };
 pc.oniceconnectionstatechange=async()=>{
   if(!pc)return;
   if((pc.iceConnectionState==="failed"||pc.iceConnectionState==="disconnected") && role==="caller"){
     try{
       const offer=await pc.createOffer({iceRestart:true});
       await pc.setLocalDescription(offer);
       send({type:"offer",sdp:pc.localDescription});
     }catch(err){console.warn("ICE restart failed",err)}
   }
 };
 async function restartIce(){
   if(!pc||role!=="caller"||!started)return;
   try{
     const offer=await pc.createOffer({iceRestart:true});
     await pc.setLocalDescription(offer);
     send({type:"offer",sdp:pc.localDescription});
   }catch(e){console.warn("restart",e)}
 }
}

async function startMicrophone(){
 if(started)return;
 try{
   await requestNotifications();
   await loadTURN();
   if(!navigator.mediaDevices?.getUserMedia)throw new Error("getUserMedia unavailable");

   localStream=await navigator.mediaDevices.getUserMedia({
     audio:{
       echoCancellation:true,noiseSuppression:true,autoGainControl:true,
       channelCount:1
     },
     video:false
   });

   started=true;
   startBtn.classList.add("danger");
   setMicGraphics();
   setStatus("میکروفون فعال است");
   setHero("میکروفون وصل شد","منتظر نفر دوم...");
   updateBadges();
   await setupMediaSession();
   await preparePeer();
   await showCallNotification();
   updateBadges();

   if(role==="caller")await makeOffer();
 }catch(e){
   console.error(e);
   setStatus("مجوز میکروفون لازم است");
   setHero("دسترسی به میکروفون برقرار نشد","مجوز میکروفون مرورگر را بررسی کن");
 }
}

async function makeOffer(){
 await preparePeer();
 const offer=await pc.createOffer();
 await pc.setLocalDescription(offer);
 send({type:"offer",sdp:pc.localDescription});
}

async function toggleMute(){
 if(!localStream || !started)return;
 muted=!muted;
 localStream.getAudioTracks().forEach(t=>{t.enabled=!muted;});
 // Never stop/remove/replace the sender track. Remote playback is completely separate.
 if(pc){
   for(const sender of pc.getSenders()){
     if(sender.track?.kind==="audio")sender.track.enabled=!muted;
   }
 }

 updateMicState();
 setHero(
   muted?"میکروفون خاموش است":"میکروفون روشن است",
   "تماس همچنان برقرار است"
 );
 setStatus("تماس برقرار است",true);
 card.classList.add("calling");
 if("mediaSession" in navigator)navigator.mediaSession.playbackState="playing";
 // Mute only changes the local sender track. Never touch remoteAudio.
 remoteAudio.muted=false;
 remoteAudio.volume=1;
 if(remoteAudio.srcObject)await remoteAudio.play().catch(()=>{});
 if(Notification.permission==="granted")await showCallNotification();
}

async function hangup(){
 if(localStream)localStream.getTracks().forEach(t=>t.stop());
 if(pc)pc.close();
 pc=null;localStream=null;started=false;muted=false;pendingIce=[];remoteDescriptionSet=false;
 clearTimeout(restartTimer);
 remoteAudio.srcObject=null;
 if("mediaSession" in navigator){
   try{navigator.mediaSession.playbackState="none";navigator.mediaSession.setMicrophoneActive?.(false)}catch{}
 }
 startBtn.disabled=false;
 startBtn.classList.remove("danger");
 setMicGraphics();
 card.classList.remove("calling");
 stopTimer();
 setStatus("تماس قطع شد");
 setHero("آماده برای تماس","با یک لمس میکروفون را فعال کن");
 try{
   const reg=await navigator.serviceWorker.ready;
   await reg.getNotifications({tag:"voice-chat-call"}).then(ns=>ns.forEach(n=>n.close()));
 }catch{}
}

ws.onopen=()=>setStatus("به اتاق وصل شد");
ws.onmessage=async e=>{
 const m=JSON.parse(e.data);

 if(m.type==="full"){
   setStatus("این اتاق پر است");
   setHero("اتاق پر است","این اتاق فقط برای دو نفر است");
   startBtn.disabled=true;
   return;
 }

 if(m.type==="joined"){
   setStatus(m.peers===1?"منتظر نفر دوم...":"دو نفر در اتاق هستند");
   setHero(m.peers===1?"منتظر نفر دوم...":"دو نفر در اتاق","حالا می‌توانی میکروفون را وصل کنی");
   return;
 }

 if(m.type==="ready"){
   role=m.role;
   if(role==="caller"&&started)await makeOffer();
   if(started)await setupMediaSession();
   return;
 }

 if(m.type==="offer"){
   await preparePeer();
   await pc.setRemoteDescription(m.sdp);
   remoteDescriptionSet=true;
   for(const candidate of pendingIce.splice(0)){
     try{await pc.addIceCandidate(candidate)}catch(err){console.warn("queued ICE",err)}
   }
   const answer=await pc.createAnswer();
   await pc.setLocalDescription(answer);
   send({type:"answer",sdp:pc.localDescription});
   return;
 }

 if(m.type==="answer"){
   if(pc){
     await pc.setRemoteDescription(m.sdp);
     remoteDescriptionSet=true;
     for(const candidate of pendingIce.splice(0)){
       try{await pc.addIceCandidate(candidate)}catch(err){console.warn("queued ICE",err)}
     }
   }
   return
 }
 if(m.type==="ice"){
   if(!pc)return;
   if(!remoteDescriptionSet){pendingIce.push(m.candidate);return}
   try{await pc.addIceCandidate(m.candidate)}catch(err){console.warn("ICE",err)}
   return
 }

 if(m.type==="peer-left"){
   remoteAudio.srcObject=null;
   if("mediaSession" in navigator)navigator.mediaSession.playbackState="none";
   stopTimer();
   card.classList.remove("calling");
   setStatus("نفر مقابل خارج شد");
   setHero("تماس تمام شد","برای شروع دوباره همان دکمه را بزن");
   ding();
   updateBadges();
 }
};

startBtn.onclick=()=>started?hangup():startMicrophone();
muteBtn.onclick=()=>toggleMute();
setMicGraphics();

window.addEventListener("beforeunload",()=>{
 if(localStream)localStream.getTracks().forEach(t=>t.stop());
 if(pc)pc.close();
 ws.close();
});
</script>
</body>
</html>
