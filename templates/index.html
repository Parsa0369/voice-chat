<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="تماس صوتی دو نفره">
<link rel="manifest" href="/manifest.webmanifest">
<title>Voice Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 0,#344b83 0,#151d32 42%,#070a11 100%);display:grid;place-items:center;padding:18px}
.card{width:min(94vw,480px);padding:28px 22px;border:1px solid rgba(255,255,255,.12);border-radius:34px;background:rgba(13,19,33,.86);backdrop-filter:blur(22px);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center}
.logo{width:92px;height:92px;margin:0 auto 16px;border-radius:30px;display:grid;place-items:center;font-size:43px;background:linear-gradient(145deg,#5b8cff,#7d4dff);box-shadow:0 16px 40px rgba(79,120,255,.32)}
h1{margin:0;font-size:29px}p{color:#aebbd0;line-height:1.9;margin:8px 0 18px}
.status{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;border-radius:17px;background:rgba(255,255,255,.055);margin-bottom:14px;font-weight:bold}
.dot{width:10px;height:10px;border-radius:50%;background:#f59e0b}.online .dot{background:#22c55e;box-shadow:0 0 15px #22c55e}
.room{font-size:13px;color:#8fb7ff;word-break:break-all;margin-bottom:16px}
.avatar{width:66px;height:66px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.timer{font-size:14px;color:#8f9db5;min-height:22px;margin-bottom:8px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{width:100%;border:0;border-radius:17px;padding:15px 12px;font:inherit;font-weight:bold;color:white;background:#3978ff;cursor:pointer;transition:.18s;box-shadow:0 8px 20px rgba(0,0,0,.18)}
button:active{transform:scale(.97)}button:disabled{opacity:.42;cursor:not-allowed}.secondary{background:#293449}.danger{background:#d9364a}.mute{background:#6d4cff}.muted{background:#b45309}
#copy{margin-top:10px}
.hint{font-size:11px;color:#74829a;line-height:1.8;margin-top:17px}.hidden{display:none}
audio{display:none}
@media(max-width:360px){.card{padding:24px 16px}.controls{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<main class="card">
<div class="logo" id="logo">🎙️</div>
<h1>تماس صوتی</h1>
<p>اتصال دو نفره با صدا. وقتی تماس برقرار شد، از همین‌جا می‌توانی صدا را وصل یا قطع کنی.</p>
<div id="status" class="status"><span class="dot"></span><span>در حال اتصال...</span></div>
<div id="room" class="room"></div>
<div class="avatar" id="avatar">👤</div>
<div class="timer" id="timer"></div>
<div class="controls">
<button id="start">🎙️ وصل کردن میکروفون</button>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<div class="hint">در مرورگرهای پشتیبانی‌شده، کنترل رسانه‌ای سیستم می‌تواند گزینه‌ی روشن/خاموش کردن میکروفون را هم ارائه کند.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const statusEl=$("status"),statusText=statusEl.querySelector("span:last-child"),startBtn=$("start"),remoteAudio=$("remoteAudio"),roomEl=$("room"),timerEl=$("timer"),logo=$("logo");
let muted=false,remoteMuted=false,callStartedAt=0,timerHandle=null;
const parts=location.pathname.split("/").filter(Boolean);
let roomId=parts[0]==="room"&&parts[1]?decodeURIComponent(parts[1]):crypto.randomUUID().slice(0,8);
if(!location.pathname.startsWith("/room/"))history.replaceState({}, "", "/room/"+encodeURIComponent(roomId));
roomEl.textContent="اتاق: "+roomId;
const wsProtocol=location.protocol==="https:"?"wss:":"ws:";
const ws=new WebSocket(wsProtocol+"//"+location.host+"/ws/"+encodeURIComponent(roomId));
let pc=null,localStream=null,role=null,started=false,remoteConnected=false;
const rtcConfig={iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
]};
function setStatus(t,online=false){statusText.textContent=t;statusEl.classList.toggle("online",online);logo.textContent=online?"📞":"🎙️"}
function startTimer(){if(timerHandle)return;callStartedAt=Date.now();timerHandle=setInterval(()=>{const s=Math.floor((Date.now()-callStartedAt)/1000),m=String(Math.floor(s/60)).padStart(2,"0"),sec=String(s%60).padStart(2,"0");timerEl.textContent=m+":"+sec},1000)}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;timerEl.textContent=""}
function send(x){if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(x))}
async function setupMediaSession(){
if(!("mediaSession" in navigator))return;
navigator.mediaSession.metadata=new MediaMetadata({title:"Voice Chat",artist:"تماس صوتی",album:"Voice Chat"});
for(const [action,fn] of [
["play",()=>{remoteAudio.muted=false;remoteAudio.play().catch(()=>{})}],
["pause",()=>{remoteAudio.muted=true}],
["stop",()=>hangup()],
["hangup",()=>hangup()],
["togglemicrophone",()=>toggleMute()]
]){try{navigator.mediaSession.setActionHandler(action,fn)}catch{}}
}
async function notify(text){
if(!("Notification" in window))return;
try{
if(Notification.permission==="default")await Notification.requestPermission();
if(Notification.permission==="granted")new Notification("Voice Chat",{body:text,tag:"voice-chat",silent:true});
}catch{}
}
async function preparePeer(){
if(pc)return;
pc=new RTCPeerConnection(rtcConfig);
if(localStream)for(const track of localStream.getTracks())pc.addTrack(track,localStream);
pc.onicecandidate=e=>{if(e.candidate)send({type:"ice",candidate:e.candidate})};
pc.ontrack=async e=>{
remoteAudio.srcObject=e.streams[0];
remoteConnected=true;
await remoteAudio.play().catch(()=>{});
if("mediaSession" in navigator){navigator.mediaSession.playbackState="playing";try{navigator.mediaSession.setMicrophoneActive?.(!muted)}catch{}}
setStatus("تماس برقرار است",true);startTimer();

await notify("تماس صوتی برقرار شد");
};
pc.onconnectionstatechange=()=>{
if(pc.connectionState==="connected"){setStatus("تماس برقرار است",true);startTimer();}
if(["failed","disconnected"].includes(pc.connectionState))setStatus("اتصال ناپایدار است");
};
}
async function startMicrophone(){
if(started)return;
try{
if(!navigator.mediaDevices?.getUserMedia)throw new Error("getUserMedia unavailable");
localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
started=true;startBtn.textContent="🔴 قطع کردن میکروفون";startBtn.classList.add("danger");
await setupMediaSession();await preparePeer();
setStatus("میکروفون آماده است؛ منتظر نفر دوم...");
if(role==="caller")await makeOffer();
}catch(e){console.error(e);setStatus("برای شروع تماس باید اجازه‌ی میکروفون را بدهی.");}
}
async function makeOffer(){
await preparePeer();
const offer=await pc.createOffer();
await pc.setLocalDescription(offer);
send({type:"offer",sdp:pc.localDescription});
}
ws.onopen=()=>setStatus("به اتاق وصل شد؛ در حال آماده‌سازی...");
ws.onmessage=async e=>{
const m=JSON.parse(e.data);
if(m.type==="full"){setStatus("این اتاق پر است.");startBtn.disabled=true;return}
if(m.type==="joined"){setStatus(m.peers===1?"منتظر نفر دوم...":"دو نفر در اتاق هستند.");return}
if(m.type==="ready"){
role=m.role;
if(role==="caller"&&started)await makeOffer();
if(started)await setupMediaSession();
return;
}
if(m.type==="offer"){
await preparePeer();await pc.setRemoteDescription(m.sdp);
const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
send({type:"answer",sdp:pc.localDescription});return;
}
if(m.type==="answer"){if(pc)await pc.setRemoteDescription(m.sdp);return}
if(m.type==="ice"){if(pc)try{await pc.addIceCandidate(m.candidate)}catch(err){console.warn(err)}return}
if(m.type==="peer-left"){remoteAudio.srcObject=null;remoteConnected=false;if("mediaSession"in navigator)navigator.mediaSession.playbackState="none";setStatus("نفر مقابل از تماس خارج شد.")}
};
async function toggleMute(){
if(!localStream)return;
muted=!muted;
localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
if("mediaSession" in navigator){
try{navigator.mediaSession.setMicrophoneActive?.(!muted)}catch{}
}
}
async function hangup(){
if(localStream)localStream.getTracks().forEach(t=>t.stop());
if(pc)pc.close();pc=null;started=false;remoteConnected=false;remoteAudio.srcObject=null;
if("mediaSession"in navigator)navigator.mediaSession.playbackState="none";
startBtn.disabled=false;startBtn.textContent="🎙️ وصل کردن میکروفون";startBtn.classList.remove("danger");
muted=false;remoteMuted=false;remoteAudio.muted=false;
stopTimer();setStatus("تماس قطع شد.");
}
startBtn.onclick=async()=>{if(started){await hangup()}else{await startMicrophone()}};
window.addEventListener("beforeunload",()=>{if(localStream)localStream.getTracks().forEach(t=>t.stop());if(pc)pc.close();ws.close()});

// If microphone permission was already granted, try to start automatically.
(async()=>{
try{
const perms=navigator.permissions?.query?await navigator.permissions.query({name:"microphone"}):null;
if(perms?.state==="granted")await startMicrophone();
}catch{}
})();
</script>
</body>
</html>
