<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - صفحه پیدا نشد</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#2b1745,#090611 70%);
      color:#fff;text-align:center;padding:24px
    }
    .box{max-width:560px}
    .cat{font-size:110px;line-height:1;margin-bottom:18px}
    h1{font-size:34px;margin:0 0 10px}
    p{font-size:18px;color:#cfc5d8;margin:0 0 24px}
    a{
      display:inline-block;padding:12px 22px;border-radius:14px;
      background:#7657ff;color:white;text-decoration:none;font-weight:700
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="cat" aria-label="گربه ناراحت">😿</div>
    <h1>این صفحه پیدا نشد ): </h1>
    <p>گربه هم ناراحته که نتونست این صفحه رو پیدا کنه.</p>
    <a href="/">برگشت به صفحه اصلی</a>
  </main>
</body>
</html>
